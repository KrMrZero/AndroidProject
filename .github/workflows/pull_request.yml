name: CI pipeline on pr

on:
  pull_request:
    paths:
      - '**.kt'
      - '**.kts'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'firebase.json'
      - '.editorconfig'
      - '.github/**'

# Отменяем предыдущий прогон для этого PR — не жжём минуты.
concurrency:
  group: ci-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# JDK 25 совпадает с toolchainVersion в gradle/gradle-daemon-jvm.properties.
jobs:
  # ktlint проверяет только добавленные в PR строки, поэтому старые
  # нарушения не блокируют новые изменения.
  ktlint:
    name: Check Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ktlint
        uses: ScaCap/action-ktlint@v1.9.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: added
          ktlint_version: 1.8.0
          fail_on_error: true

  build:
    name: Build & test with Firebase Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # PR-сборка не использует Doppler, поэтому для Firebase-эмуляторов
      # подкладываем mock-конфиг с demo-проектом.
      - name: Prepare mock google-services.json
        run: cp .github/mock-google-services.json app/google-services.json

      - name: Set up Node.js (for Firebase CLI)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      # Сборка, unit-тесты и lint. Инструментальные тесты компилируем отдельно,
      # чтобы ошибка компиляции не ждала загрузки Android-эмулятора.
      - name: Build and run unit tests
        run: ./gradlew build --no-daemon --console=plain

      - name: Compile instrumentation tests
        run: ./gradlew :app:assembleDebugAndroidTest --no-daemon --console=plain

      # KVM нужен Android-эмулятору для аппаратного ускорения.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # android-emulator-runner поднимает Android-устройство и выполняет `script`
      # на хосте, пока устройство запущено.
      # `firebase emulators:exec` поднимает Auth (9099) и Firestore (8080) на
      # хосте; Android-эмулятор обращается к ним через 10.0.2.2.
      # Важно: экшен выполняет каждую строку `script` отдельно, поэтому
      # команда firebase должна быть одной строкой без `\`.
      - name: Run instrumented tests with Firebase emulators
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            firebase emulators:exec --only auth,firestore --project demo-coflow './gradlew connectedDebugAndroidTest --no-daemon --console=plain'
